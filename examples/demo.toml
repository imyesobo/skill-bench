# Cheap smoke test: ./bench.py run examples/demo.toml
# Remove the agents whose CLI you don't have installed.

[settings]
jobs = 8
baseline = true

[[skills]]
id = "a"
path = "skills/echo-a"

[[skills]]
id = "b"
path = "skills/echo-b"

[[agents]]
id = "copilot-haiku"
harness = "copilot"
model = "claude-haiku-4.5"

[[agents]]
id = "opencode-haiku"
harness = "opencode"
model = "github-copilot/claude-haiku-4.5"

[[tasks]]
id = "fruit"
prompt = "Give me a fruit fact."
must_contain = ["FACT-"]
